name: GitHub CI

on:
  pull_request:
    paths-ignore:
      - examples
      - Dockerfile.template
      - LICENSE
      - README.md
      - SECURITY.md
      - Containerfile.debug
      - Containerfile.debug-ubi
  push:
    paths-ignore:
      - examples
      - Dockerfile.template
      - LICENSE
      - README.md
      - SECURITY.md
      - Containerfile.debug
      - Containerfile.debug-ubi

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: initdb.d
          ignore_names: generate-stackbrew-library.sh
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v2.0.0
        with:
          dockerfile: Dockerfile.template

  generate-jobs:
    name: Generate Jobs
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.generate-jobs.outputs.strategy }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker-library/bashbrew@v0.1.13
      - id: generate-jobs
        name: Generate Jobs
        run: |
          strategy="$(
            GITHUB_REPOSITORY='mariadb' \
              "$BASHBREW_SCRIPTS/github-actions/generate.sh" |
            jq -c '
              .matrix.include |= map(
                . as $item
                | $item.meta.entries[0].tags[0] as $tag
                | (if (.meta.froms[0] | startswith("redhat"))
                   then "Containerfile.plugin-ubi"
                   else "Containerfile.plugin"
                   end) as $containerfile
                | .runs.mariadbtest = "./.test/run.sh " + $tag
                | .runs.origbuild = .runs.build + " --load"
                | .runs.build |= (
                    gsub("mariadb:"; "ghcr.io/mariadb/mariadb:")
                    | sub(
                        "linux/amd64";
                        "linux/amd64,linux/arm64/v8,linux/ppc64le,linux/s390x"
                      )
                  )
                | if ($item.name | startswith("10")) then
                    .
                  else
                    .runs.duckbuild = (
                      .runs.build
                      | gsub(
                          "ghcr.io/mariadb/mariadb:";
                          "ghcr.io/mariadb/duckdb:"
                        )
                      | sub(",linux/ppc64le,linux/s390x"; "")
                      + " --build-arg BASE=ghcr.io/mariadb/mariadb:" + $item.name
                      + " --build-arg PLUGIN=duckdb"
                      + " -f " + $containerfile
                    )
                  end
              )
            '
          )"
      
          echo "strategy=$strategy" >> "$GITHUB_OUTPUT"
      
          # sanity check / debugging aid
          jq . <<<"$strategy"

  test:
    needs: generate-jobs
    strategy: ${{ fromJson(needs.generate-jobs.outputs.strategy) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      DEPLOY_IMAGES: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for registry credentials
        if: github.repository == 'MariaDB/mariadb-docker' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/fips_test')
        run: |
          missing=()
          [[ -n "${{ secrets.MARIADB_OPERATOR_TOKEN }}" ]] || missing+=(MARIADB_OPERATOR_TOKEN)
          for i in "${missing[@]}"; do
            echo "Missing github secret: $i"
          done
          if (( ${#missing[@]} == 0 )); then
            echo "DEPLOY_IMAGES=true" >> $GITHUB_ENV
          else
            echo "Not pushing images to registry or doing operator test"
          fi
      - name: Prepare Environment
        run: ${{ matrix.runs.prepare }}
      - name: Pull Dependencies
        run: ${{ matrix.runs.pull }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: login to registry
        if: ${{ env.DEPLOY_IMAGES == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all ${{ matrix.name }}
        if: ${{ env.DEPLOY_IMAGES == 'true' }}
        run: ${{ matrix.runs.build }} --push
      - name: Build DuckDB ${{ matrix.name }}
        if: ${{ env.DEPLOY_IMAGES == 'true' }}
        run: ${{ matrix.runs.duckbuild }} --push
      - name: Build for test ${{ matrix.name }}
        run: ${{ matrix.runs.origbuild }}
      - name: History ${{ matrix.name }}
        run: ${{ matrix.runs.history }}
      - name: Test ${{ matrix.name }}
        run: ${{ matrix.runs.test }}
      - name: Extra MariaDB Tests ${{ matrix.name }}
        run: ${{ matrix.runs.mariadbtest }}
      - name: '"docker images"'
        run: ${{ matrix.runs.images }}
      - name: MariaDB Operator Test (non-UBI)
        if: ${{ env.DEPLOY_IMAGES == 'true' && !contains( matrix.name, 'ubi') }}
        run: gh workflow run test-image.yml --repo mariadb-operator/mariadb-operator -f mariadb_image=ghcr.io/mariadb/mariadb:${{ matrix.name }} -f mariadb_version=${JOB%%-*}
        env:
          GITHUB_TOKEN: "${{ secrets.MARIADB_OPERATOR_TOKEN }}"
          JOB: "${{ github.job }}"
      - name: MariaDB Operator Test (UBI)
        if: ${{ env.DEPLOY_IMAGES == 'true' && contains( matrix.name, 'ubi') }}
        run: gh workflow run test-image-ubi.yml --repo mariadb-operator/mariadb-operator -f mariadb_image=ghcr.io/mariadb/mariadb:${{ matrix.name }} -f mariadb_version=${JOB%%-*}
        env:
          GITHUB_TOKEN: "${{ secrets.MARIADB_OPERATOR_TOKEN }}"
          JOB: "${{ github.job }}"
